<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="정령디펜스">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<title>정령 디펜스</title>
<style>
/* ══════════════════════════════
   리셋 & 기본
══════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep:    #0a0812;
  --bg-mid:     #110d1e;
  --purple:     #7c3aed;
  --purple-lt:  #a855f7;
  --purple-dim: #4c1d95;
  --gold:       #f59e0b;
  --gold-lt:    #fcd34d;
  --teal:       #2dd4bf;
  --red:        #ef4444;
  --text:       #e2d9f3;
  --text-dim:   #8b7aaa;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--text);
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

/* ══════════════════════════════
   화면 레이어 시스템
══════════════════════════════ */
.screen {
  position: fixed; inset: 0;
  display: none;
  align-items: center; justify-content: center;
}
.screen.active { display: flex; }

/* ══════════════════════════════
   파티클 배경 (공통)
══════════════════════════════ */
#bg-canvas {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

/* ══════════════════════════════
   ① 로딩 화면
══════════════════════════════ */
#loading-screen {
  flex-direction: column; gap: 20px;
  background: var(--bg-deep); z-index: 10;
}
.loading-orb {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #c084fc, #7c3aed 60%, #3b0764);
  box-shadow: 0 0 40px #7c3aed88;
  animation: orb-pulse 1.5s ease-in-out infinite;
}
@keyframes orb-pulse {
  0%,100% { transform: scale(1);   box-shadow: 0 0 40px #7c3aed88; }
  50%      { transform: scale(1.1); box-shadow: 0 0 70px #a855f7cc; }
}
.loading-text {
  font-size: 14px; letter-spacing: 4px;
  color: var(--text-dim); text-transform: uppercase;
}
.loading-bar-wrap {
  width: 200px; height: 3px;
  background: #1e1535; border-radius: 2px; overflow: hidden;
}
.loading-bar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--purple), var(--purple-lt));
  border-radius: 2px;
  transition: width 0.1s linear;
}

/* ══════════════════════════════
   ② 인트로 (오프닝 스토리)
══════════════════════════════ */
#intro-screen {
  flex-direction: column;
  background: var(--bg-deep); z-index: 9;
  padding: 40px 60px;
}
.intro-lines {
  max-width: 560px; text-align: center;
}
.intro-line {
  font-size: 18px; line-height: 2;
  color: var(--text); opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}
.intro-line.visible {
  opacity: 1; transform: translateY(0);
}
.intro-line.highlight {
  color: var(--gold-lt);
  font-size: 20px; font-weight: bold;
  letter-spacing: 1px;
}
.intro-skip {
  position: fixed; bottom: 30px; right: 30px;
  font-size: 12px; color: var(--text-dim);
  letter-spacing: 3px; cursor: pointer;
  opacity: 0; animation: fade-in 1s 2s forwards;
  background: none; border: none; color: var(--text-dim);
}
.intro-skip:hover { color: var(--text); }
@keyframes fade-in { to { opacity: 1; } }

/* ══════════════════════════════
   ③ 타이틀 화면
══════════════════════════════ */
#title-screen {
  flex-direction: column; gap: 0;
  z-index: 8;
}

/* 배경 그라디언트 */
.title-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 30%, #2d1b6940 0%, transparent 65%),
    radial-gradient(ellipse at 20% 80%, #1e3a5f30 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, #3b0764 20 0%, transparent 50%),
    var(--bg-deep);
}

/* 포탈 장식 */
.title-portal {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -60%);
  width: 280px; height: 280px;
  border-radius: 50%;
  border: 2px solid #7c3aed44;
  box-shadow:
    0 0 60px #7c3aed33,
    inset 0 0 60px #7c3aed22;
  animation: portal-rotate 8s linear infinite;
}
.title-portal::before {
  content: '';
  position: absolute; inset: 10px;
  border-radius: 50%;
  border: 1px solid #a855f733;
  animation: portal-rotate 5s linear infinite reverse;
}
.title-portal::after {
  content: '';
  position: absolute; inset: 25px;
  border-radius: 50%;
  background: radial-gradient(circle, #1a0a3040 0%, #0a081280 100%);
  border: 1px solid #c084fc22;
}
@keyframes portal-rotate {
  to { transform: rotate(360deg); }
}

/* 타이틀 콘텐츠 */
.title-content {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 8px;
  margin-top: -40px;
}
.title-sub {
  font-size: 11px; letter-spacing: 8px;
  color: var(--purple-lt); text-transform: uppercase;
  opacity: 0; animation: fade-in 0.8s 0.3s forwards;
}
.title-main {
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 900; letter-spacing: 4px;
  background: linear-gradient(135deg, #fcd34d, #f59e0b, #fcd34d);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 20px #f59e0b66);
  opacity: 0; animation: title-appear 1s 0.6s forwards;
  line-height: 1.1;
}
@keyframes title-appear {
  from { opacity: 0; transform: translateY(-20px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.title-eng {
  font-size: clamp(10px, 2vw, 14px);
  letter-spacing: 12px; color: var(--text-dim);
  opacity: 0; animation: fade-in 0.8s 1s forwards;
}
.title-version {
  font-size: 10px; letter-spacing: 3px;
  color: #4c3a7a; margin-top: 4px;
  opacity: 0; animation: fade-in 0.8s 1.2s forwards;
}

/* 버튼 영역 */
.title-buttons {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  margin-top: 48px;
  opacity: 0; animation: fade-in 0.8s 1.6s forwards;
}

.btn-primary {
  width: 220px; padding: 16px 0;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none; border-radius: 12px;
  color: #fff; font-size: 16px; font-weight: bold;
  letter-spacing: 4px; cursor: pointer;
  box-shadow: 0 4px 20px #7c3aed66, 0 0 0 1px #a855f744;
  transition: all 0.2s;
  font-family: inherit;
  position: relative; overflow: hidden;
}
.btn-primary::before {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, #ffffff22, transparent);
  transition: left 0.4s;
}
.btn-primary:hover::before { left: 100%; }
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px #7c3aed88;
}
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  width: 220px; padding: 12px 0;
  background: transparent;
  border: 1px solid #4c1d95;
  border-radius: 10px;
  color: var(--text-dim); font-size: 13px;
  letter-spacing: 3px; cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.btn-secondary:hover {
  border-color: var(--purple-lt);
  color: var(--text);
  background: #7c3aed11;
}

/* 하단 정보 */
.title-footer {
  position: fixed; bottom: 16px;
  left: 50%; transform: translateX(-50%);
  font-size: 10px; color: #4c3a7a;
  letter-spacing: 2px; z-index: 1;
  opacity: 0; animation: fade-in 0.8s 2s forwards;
}

/* ══════════════════════════════
   ④ 레벨 선택 화면
══════════════════════════════ */
#level-screen {
  flex-direction: column; gap: 0;
  z-index: 7;
  background: var(--bg-deep);
  padding: 0;
}

.level-header {
  display: flex; align-items: center;
  padding: 16px 20px; gap: 12px;
  border-bottom: 1px solid #1e1535;
  width: 100%;
}
.level-back {
  background: none; border: 1px solid #2a1f4a;
  border-radius: 8px; color: var(--text-dim);
  font-size: 12px; padding: 8px 14px;
  cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.level-back:hover { border-color: var(--purple); color: var(--text); }
.level-title-txt {
  font-size: 14px; letter-spacing: 4px;
  color: var(--gold); font-weight: bold;
  flex: 1; text-align: center;
}
.level-gold-display {
  font-size: 13px; color: var(--gold-lt);
  display: flex; align-items: center; gap: 6px;
}

.level-list {
  flex: 1; width: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 20px;
  overflow-y: auto;
}

.level-card {
  width: 100%; max-width: 480px;
  border-radius: 16px; overflow: hidden;
  border: 1px solid #2a1f4a;
  cursor: pointer; transition: all 0.25s;
  position: relative;
}
.level-card:hover {
  border-color: var(--purple);
  transform: translateY(-2px);
  box-shadow: 0 8px 30px #7c3aed44;
}
.level-card.locked {
  opacity: 0.45; cursor: not-allowed;
}
.level-card.locked:hover { transform: none; box-shadow: none; }

.level-card-img {
  width: 100%; height: 110px;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; position: relative;
  overflow: hidden;
}
.level-card-img.forest {
  background: linear-gradient(135deg, #064e3b, #065f46, #047857);
}
.level-card-img.bridge {
  background: linear-gradient(135deg, #1e3a5f, #1e40af, #1d4ed8);
}
.level-card-img.fortress {
  background: linear-gradient(135deg, #3b0764, #4c1d95, #6d28d9);
}
.level-card-img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.6));
}

.level-card-info {
  padding: 12px 16px;
  background: #110d1e;
  display: flex; align-items: center; gap: 12px;
}
.level-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--purple), var(--purple-lt));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: bold; color: #fff;
  flex-shrink: 0;
}
.level-info-text { flex: 1; }
.level-name { font-size: 14px; font-weight: bold; color: var(--text); }
.level-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.level-waves { font-size: 11px; color: var(--purple-lt); }
.lock-icon { font-size: 18px; }

.level-play-btn {
  width: 100%; max-width: 480px;
  padding: 15px; margin: 8px 0;
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  border: none; border-radius: 12px;
  color: #fff; font-size: 15px; font-weight: bold;
  letter-spacing: 3px; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
}
.level-play-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px #7c3aed66; }
.level-play-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ══════════════════════════════
   ⑤ 설정 화면
══════════════════════════════ */
#settings-screen {
  flex-direction: column; gap: 20px;
  z-index: 7;
  background: var(--bg-deep);
  padding: 40px;
}
.settings-title {
  font-size: 18px; letter-spacing: 4px;
  color: var(--gold); font-weight: bold;
}
.settings-row {
  display: flex; align-items: center;
  justify-content: space-between;
  width: 100%; max-width: 400px;
  padding: 14px 0;
  border-bottom: 1px solid #1e1535;
  font-size: 14px; color: var(--text);
}
.settings-row label { color: var(--text-dim); font-size: 12px; letter-spacing: 2px; }
.toggle-btn {
  width: 48px; height: 26px;
  border-radius: 13px; border: none;
  background: #2a1f4a; cursor: pointer;
  position: relative; transition: background 0.2s;
}
.toggle-btn.on { background: var(--purple); }
.toggle-btn::after {
  content: '';
  position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px;
  border-radius: 50%; background: #fff;
  transition: transform 0.2s;
}
.toggle-btn.on::after { transform: translateX(22px); }
.settings-back {
  padding: 12px 32px;
  background: transparent; border: 1px solid #4c1d95;
  border-radius: 10px; color: var(--text-dim);
  font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all 0.2s;
  margin-top: 10px;
}
.settings-back:hover { border-color: var(--purple-lt); color: var(--text); }

/* ══════════════════════════════
   토스트 알림
══════════════════════════════ */
#toast {
  position: fixed; top: 20px; left: 50%;
  transform: translateX(-50%);
  background: #1e1535; border: 1px solid var(--purple);
  border-radius: 8px; padding: 10px 20px;
  font-size: 13px; color: var(--text);
  z-index: 100; opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; }

/* 반응형 - 가로형 강제 */
@media (orientation: portrait) {
  #rotate-hint {
    display: flex !important;
  }
}
#rotate-hint {
  display: none;
  position: fixed; inset: 0; z-index: 999;
  background: var(--bg-deep);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 16px;
}
.rotate-icon {
  font-size: 48px;
  animation: rotate-hint-anim 1.5s ease-in-out infinite;
}
@keyframes rotate-hint-anim {
  0%,100% { transform: rotate(0deg); }
  50%      { transform: rotate(90deg); }
}
.rotate-text { font-size: 14px; color: var(--text-dim); letter-spacing: 2px; }
</style>
</head>
<body>

<!-- 가로모드 안내 -->
<div id="rotate-hint">
  <div class="rotate-icon">📱</div>
  <div class="rotate-text">가로로 돌려주세요</div>
</div>

<!-- 배경 파티클 캔버스 -->
<canvas id="bg-canvas"></canvas>

<!-- ① 로딩 화면 -->
<div id="loading-screen" class="screen active">
  <div class="loading-orb"></div>
  <div class="loading-text">LOADING</div>
  <div class="loading-bar-wrap">
    <div class="loading-bar-fill" id="loading-bar"></div>
  </div>
</div>

<!-- ② 인트로 오프닝 -->
<div id="intro-screen" class="screen">
  <div class="intro-lines" id="intro-lines"></div>
  <button class="intro-skip" onclick="skipIntro()">SKIP ▶</button>
</div>

<!-- ③ 타이틀 화면 -->
<div id="title-screen" class="screen">
  <div class="title-bg"></div>
  <div class="title-portal"></div>
  <div class="title-content">
    <div class="title-sub">DEMONS VS. SPIRITS</div>
    <div class="title-main">정령 디펜스</div>
    <div class="title-eng">SPIRIT DEFENSE</div>
    <div class="title-version">v2.0 — ALPHA</div>
  </div>
  <div class="title-buttons">
    <button class="btn-primary" onclick="showLevelSelect()">▶ 게임 시작</button>
    <button class="btn-secondary" onclick="showSettings()">⚙ 설정</button>
  </div>
  <div class="title-footer">© 2025 SPIRIT DEFENSE — ALL RIGHTS RESERVED</div>
</div>

<!-- ④ 레벨 선택 -->
<div id="level-screen" class="screen">
  <div class="level-header">
    <button class="level-back" onclick="showTitle()">← 뒤로</button>
    <div class="level-title-txt">스테이지 선택</div>
    <div class="level-gold-display">💰 <span id="player-gold">0</span></div>
  </div>
  <div class="level-list">

    <div class="level-card" id="level-1" onclick="selectLevel(1)">
      <div class="level-card-img forest">🌲</div>
      <div class="level-card-info">
        <div class="level-num">1</div>
        <div class="level-info-text">
          <div class="level-name">정령의 숲</div>
          <div class="level-desc">포탈에서 나온 악마들이 3갈래로 밀려온다</div>
          <div class="level-waves">20 웨이브 · 보스 2회</div>
        </div>
      </div>
    </div>

    <div class="level-card locked" id="level-2">
      <div class="level-card-img bridge">🌉</div>
      <div class="level-card-info">
        <div class="level-num">2</div>
        <div class="level-info-text">
          <div class="level-name">협곡의 다리</div>
          <div class="level-desc">좁은 다리 위아래로 악마가 밀려온다</div>
          <div class="level-waves">20 웨이브 · 보스 2회</div>
        </div>
        <div class="lock-icon">🔒</div>
      </div>
    </div>

    <div class="level-card locked" id="level-3">
      <div class="level-card-img fortress">🏰</div>
      <div class="level-card-info">
        <div class="level-num">3</div>
        <div class="level-info-text">
          <div class="level-name">태초의 요새</div>
          <div class="level-desc">위에서 무작위로 악마들이 쏟아진다</div>
          <div class="level-waves">20 웨이브 · 보스 2회</div>
        </div>
        <div class="lock-icon">🔒</div>
      </div>
    </div>

    <button class="level-play-btn" id="play-btn" disabled onclick="startGame()">
      스테이지를 선택하세요
    </button>
  </div>
</div>

<!-- ⑤ 설정 화면 -->
<div id="settings-screen" class="screen">
  <div class="settings-title">⚙ 설정</div>
  <div class="settings-row">
    <label>배경음악</label>
    <button class="toggle-btn on" id="bgm-toggle" onclick="toggleSetting('bgm')"></button>
  </div>
  <div class="settings-row">
    <label>효과음</label>
    <button class="toggle-btn on" id="sfx-toggle" onclick="toggleSetting('sfx')"></button>
  </div>
  <div class="settings-row">
    <label>진동</label>
    <button class="toggle-btn on" id="vib-toggle" onclick="toggleSetting('vib')"></button>
  </div>
  <div class="settings-row">
    <label>인트로 영상</label>
    <button class="toggle-btn on" id="intro-toggle" onclick="toggleSetting('intro')"></button>
  </div>
  <button class="settings-back" onclick="showTitle()">← 타이틀로</button>
</div>

<!-- 토스트 -->
<div id="toast"></div>

<script>
// ══════════════════════════════════════════
//  설정 & 저장
// ══════════════════════════════════════════
const SAVE_KEY = 'spirit-defense-save';

const defaultSave = {
  gold: 0,
  clearedLevels: [],
  settings: { bgm: true, sfx: true, vib: true, intro: true },
};

let saveData = (() => {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { ...defaultSave }; }
  catch { return { ...defaultSave }; }
})();

function writeSave() {
  localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
}

// ══════════════════════════════════════════
//  화면 전환
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showTitle()       { showScreen('title-screen'); }
function showSettings()    { showScreen('settings-screen'); updateSettingsUI(); }
function showLevelSelect() { showScreen('level-screen'); updateLevelUI(); }

// ══════════════════════════════════════════
//  레벨 선택
// ══════════════════════════════════════════
let selectedLevel = null;

function updateLevelUI() {
  document.getElementById('player-gold').textContent = saveData.gold;

  // 클리어한 레벨 기준 잠금 해제
  [1, 2, 3].forEach(n => {
    const card = document.getElementById(`level-${n}`);
    if (!card) return;
    const isUnlocked = n === 1 || saveData.clearedLevels.includes(n - 1);
    card.classList.toggle('locked', !isUnlocked);
    if (isUnlocked) card.onclick = () => selectLevel(n);
    else card.onclick = () => showToast('이전 스테이지를 클리어해야 해요!');
  });

  // 선택 초기화
  selectedLevel = null;
  document.getElementById('play-btn').disabled = true;
  document.getElementById('play-btn').textContent = '스테이지를 선택하세요';
}

function selectLevel(n) {
  const card = document.getElementById(`level-${n}`);
  if (card.classList.contains('locked')) return;

  // 선택 표시
  document.querySelectorAll('.level-card').forEach(c => c.style.borderColor = '');
  card.style.borderColor = 'var(--purple-lt)';
  card.style.boxShadow   = '0 0 20px #a855f744';

  selectedLevel = n;
  const names = ['', '정령의 숲', '협곡의 다리', '태초의 요새'];
  const btn = document.getElementById('play-btn');
  btn.disabled = false;
  btn.textContent = `▶ ${names[n]} 시작`;
}

function startGame() {
  if (!selectedLevel) return;
  showToast(`${['', '정령의 숲', '협곡의 다리', '태초의 요새'][selectedLevel]} — 준비 중...`);
  // TODO: 2단계에서 게임 화면 연결
}

// ══════════════════════════════════════════
//  설정
// ══════════════════════════════════════════
function toggleSetting(key) {
  saveData.settings[key] = !saveData.settings[key];
  writeSave();
  updateSettingsUI();
}
function updateSettingsUI() {
  ['bgm','sfx','vib','intro'].forEach(key => {
    const btn = document.getElementById(`${key}-toggle`);
    btn.classList.toggle('on', saveData.settings[key]);
  });
}

// ══════════════════════════════════════════
//  인트로 오프닝 텍스트
// ══════════════════════════════════════════
const INTRO_LINES = [
  { text: '지옥의 봉인이 무너졌다.', highlight: false },
  { text: '여섯 군주의 악마들이 정령의 세계를 넘어', highlight: false },
  { text: '인간 세계로 침공하기 시작했다.', highlight: false },
  { text: '', highlight: false },
  { text: '정령왕은 이미 사라진 지 오래.', highlight: false },
  { text: '정령 장로회는 마지막 선택을 내렸다.', highlight: false },
  { text: '', highlight: false },
  { text: '금지되었던 원소 결합을 허용하고,', highlight: false },
  { text: '한 명의 소환자에게 모든 힘을 맡긴다.', highlight: false },
  { text: '', highlight: false },
  { text: '정령을 소환하고, 결합하라.', highlight: true },
  { text: '그리고 이 세계를 지켜라.', highlight: true },
];

let introIndex = 0;
let introTimer = null;

function showIntro() {
  showScreen('intro-screen');
  const container = document.getElementById('intro-lines');
  container.innerHTML = '';
  introIndex = 0;

  INTRO_LINES.forEach(l => {
    const div = document.createElement('div');
    div.className = 'intro-line' + (l.highlight ? ' highlight' : '');
    div.textContent = l.text || '\u00A0';
    container.appendChild(div);
  });

  function revealNext() {
    const lines = container.querySelectorAll('.intro-line');
    if (introIndex < lines.length) {
      lines[introIndex].classList.add('visible');
      introIndex++;
      introTimer = setTimeout(revealNext, introIndex <= 3 ? 900 : 700);
    } else {
      setTimeout(showTitle, 1800);
    }
  }
  revealNext();
}

function skipIntro() {
  clearTimeout(introTimer);
  showTitle();
}

// ══════════════════════════════════════════
//  토스트
// ══════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ══════════════════════════════════════════
//  배경 파티클
// ══════════════════════════════════════════
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');
let particles  = [];

function resizeBgCanvas() {
  bgCanvas.width  = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}

function initParticles() {
  particles = [];
  const count = Math.floor((bgCanvas.width * bgCanvas.height) / 8000);
  for (let i = 0; i < count; i++) {
    particles.push({
      x:    Math.random() * bgCanvas.width,
      y:    Math.random() * bgCanvas.height,
      r:    Math.random() * 1.5 + 0.3,
      vx:   (Math.random() - 0.5) * 0.2,
      vy:   -Math.random() * 0.3 - 0.1,
      alpha: Math.random() * 0.6 + 0.2,
      color: Math.random() > 0.5 ? '#a855f7' : '#7c3aed',
    });
  }
}

function animateBg() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -5) { p.y = bgCanvas.height + 5; p.x = Math.random() * bgCanvas.width; }
    bgCtx.fillStyle = p.color + Math.floor(p.alpha * 255).toString(16).padStart(2,'0');
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fill();
  });
  requestAnimationFrame(animateBg);
}

// ══════════════════════════════════════════
//  로딩
// ══════════════════════════════════════════
function runLoading() {
  const bar = document.getElementById('loading-bar');
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 15 + 5;
    if (progress >= 100) {
      progress = 100;
      bar.style.width = '100%';
      clearInterval(interval);
      setTimeout(() => {
        // 인트로 설정 확인
        if (saveData.settings.intro) showIntro();
        else showTitle();
      }, 400);
    } else {
      bar.style.width = progress + '%';
    }
  }, 80);
}

window.addEventListener('resize', () => { resizeBgCanvas(); initParticles(); });
resizeBgCanvas();
initParticles();
animateBg();
runLoading();
